name = "class"
main = "src/app-v09.ts"
compatibility_date = "2026-08-18"

[vars]
APP_NAME = "Class Registration Engine"

# Production secrets (set with wrangler secret put):
# ADMIN_TOKEN
# LINE_CHANNEL_SECRET
# Optional LINE Login vars can be set as vars/secrets before enabling LINE Login:
# LINE_CHANNEL_ID
# LINE_REDIRECT_URI

[[d1_databases]]
binding = "CLASS_DB"
database_name = "class_db"
database_id = "REPLACE_WITH_CLASS_DB_ID"
migrations_dir = "migrations"